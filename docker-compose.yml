version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifeai-network

  stt:
    build:
      context: ./lifeai-stt
      dockerfile: Dockerfile
    container_name: lifeai-stt
    ports:
      - "5000:5000"
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-False}
    volumes:
      - whisper_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    networks:
      - lifeai-network

  backend:
    build:
      context: ./lifeai-backend
      dockerfile: Dockerfile
    container_name: lifeai-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STT_SERVICE_URL: http://stt:5000
    depends_on:
      postgres:
        condition: service_healthy
      stt:
        condition: service_healthy
    networks:
      - lifeai-network

  frontend:
    build:
      context: ./lifeai-frontend
      dockerfile: Dockerfile
    container_name: lifeai-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - lifeai-network

volumes:
  postgres_data:
  whisper_cache:

networks:
  lifeai-network:
    driver: bridge
