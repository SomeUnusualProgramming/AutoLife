version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifeai-network

  backend:
    build:
      context: ./lifeai-backend
      dockerfile: Dockerfile
    container_name: lifeai-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lifeai-network

  frontend:
    build:
      context: ./lifeai-frontend
      dockerfile: Dockerfile
    container_name: lifeai-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - lifeai-network

volumes:
  postgres_data:

networks:
  lifeai-network:
    driver: bridge
