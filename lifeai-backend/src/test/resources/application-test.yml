spring:
  datasource:
    url: jdbc:h2:mem:lifeai_test
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  
  flyway:
    enabled: false
  
  h2:
    console:
      enabled: true

logging:
  level:
    root: WARN
    com.lifeai: INFO

server:
  port: 8080
